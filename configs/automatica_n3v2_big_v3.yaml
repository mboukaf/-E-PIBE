# Big run, everything sampled per trajectory.
#
# Supersedes the _v2 configs, which drew a fresh initial condition and a fresh
# disturbance for each trajectory but held theta fixed at a single value shared
# by all 2048.  That asymmetry mattered: with theta shared, a parameter head can
# satisfy the objective by emitting a constant, so "estimate theta from y" was
# never actually posed -- exactly the flaw that made an early disturbance result
# look far better than it was.  Here all three vary:
#
#   x0     uniform over chi_0, per trajectory   (unchanged)
#   a      uniform over the coefficient box, per trajectory   (unchanged)
#   theta  uniform over +/- theta_sampling_bound, per trajectory   (NEW)
#
# theta is drawn from +/-0.25 while the heads are reparameterized onto the
# admissible +/-0.4.  The margin is deliberate: sampling to the box edge places
# the truth where tanh is saturated and the head's gradient is already dead.
#
# This is a strictly harder problem than _v2 -- the encoder must now infer a
# trajectory's parameters from its measurement rather than memorise one value --
# so expect larger theta errors, and read theta_std as signal rather than noise:
# under _v2 it was ~0 by construction, here it should track the true spread.
#
# Everything else, including the saturation_limit fix, is identical to _v2.

system:
  name: automatica_n3v2
  kwargs:
    theta_seed: 0
data:
  n_trajectories: 2048
  n_samples: 201
  horizon: 20.0
  substeps: 8
  noise_sigma: 0.002
  noise_truncation_sigmas: 3.0
  train_fraction: 0.8
  sample_disturbance_per_trajectory: true
  sample_theta_per_trajectory: true
  seed: 1
  theta_sampling_bound: 0.25
basis:
  kind: fourier
  q: 3
  omega: 1.2566370614359172
  coeff_lo:
  - -0.18
  - -0.18
  - -0.12
  coeff_hi:
  - 0.18
  - 0.18
  - 0.12
  remainder_amplitude: 0.0
  remainder_rate: 0.15
architecture:
  latent_dim: 128
  encoder_hidden:
  - 512
  - 512
  decoder_hidden:
  - 256
  - 256
  - 256
  head_hidden:
  - 128
  - 128
  activation: tanh
  time_fourier_features: 10
  time_feature_scaling: true
  saturation_limit: 4.0
training:
  n_total: 20000
  n_par: 8000
  final_global_iters: 30000
  lam: 1.0
  n_collocation: 401
  batch_size: 32
  lr_local: 0.001
  lr_global: 0.0002
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 2000
  checkpoint_every: 2000
  seed: 0
device: auto
dtype: float64
seed: 0
output_dir: outputs/big_v3

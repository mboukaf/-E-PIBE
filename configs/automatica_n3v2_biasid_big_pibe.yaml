# PIBE on the bias-identifiable benchmark, cluster scale (Docs/EPIBE.md §10).
#
# The large-scale counterpart of configs/automatica_n3v2_biasid_b05.yaml, and the
# PIBE arm of the PIBE-vs-EPIBE comparison run by scripts/slurm/train_biasid.sbatch.
# Scale and optimizer follow configs/automatica_n3v2_big_v2.yaml (2048
# trajectories, one disturbance per trajectory, the big network, saturation
# floor, lr_global 2e-4).  Only the system, the noise and the final global
# budget differ.
#
#   system  automatica_n3v2_biasid   n3v2 + 0.5 sin(3 x1): a sensor offset is
#                                    identifiable (n3v2's is not; §10.1-10.2)
#   noise   sigma 0.05, bias set per job with --set data.noise_bias=...
#
# Equal budget.  EPIBE (automatica_n3v2_biasid_big_epibe.yaml) runs the same
# Algorithm-2 schedule with final_global_iters 30000, then 20000 amortization and
# 10000 re-centring iterations on the final cell's global objective.  PIBE gets
# those 30000 end-to-end iterations as extra final global iterations, so both
# arms take the same number of optimizer steps on the full chain.

system:
  name: automatica_n3v2_biasid
  kwargs:
    theta_seed: 0
data:
  n_trajectories: 2048
  n_samples: 201
  horizon: 20.0
  substeps: 8
  noise_sigma: 0.05
  noise_truncation_sigmas: 3.0
  noise_family: gaussian
  noise_bias: 0.0
  noise_bias_relative: false
  train_fraction: 0.8
  sample_disturbance_per_trajectory: true
  sample_theta_per_trajectory: false
  seed: 1
basis:
  kind: fourier
  q: 3
  omega: 1.2566370614359172
  coeff_lo:
  - -0.18
  - -0.18
  - -0.12
  coeff_hi:
  - 0.18
  - 0.18
  - 0.12
  remainder_amplitude: 0.0
  remainder_rate: 0.15
architecture:
  latent_dim: 128
  encoder_hidden:
  - 512
  - 512
  decoder_hidden:
  - 256
  - 256
  - 256
  head_hidden:
  - 128
  - 128
  activation: tanh
  time_fourier_features: 10
  time_feature_scaling: true
  saturation_limit: 4.0
training:
  n_total: 20000
  n_par: 8000
  final_global_iters: 60000
  lam: 1.0
  n_collocation: 401
  batch_size: 32
  lr_local: 0.001
  lr_global: 0.0002
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 2000
  checkpoint_every: 2000
  seed: 0
ebm:
  enabled: false
device: auto
dtype: float64
seed: 0
output_dir: outputs/biasid_big_pibe

# Harsher heavy-tail test: does the energy term earn its place at a noise
# level where the outliers are actually large?
#
# The first attempt (n3v2_contam_*) used sigma = 0.01, where a typical outlier
# is |w| ~ 0.053 -- 3.5% of x_1's amplitude.  Heavy tails cost the quadratic
# data term nothing measurable there (contaminated/Gaussian was 1.14x, 0.99x,
# 1.06x on the states), so the comparison never tested the case a learned
# likelihood is for.
#
# Here sigma = 0.05, holding the shape fixed at 5% of samples drawn 8x wider.
# A typical outlier becomes |w| ~ 0.264, 17.6% of x_1's amplitude -- a 5x
# escalation of the one variable that plausibly mattered, with nothing else
# changed.  The noise is still ZERO MEAN, so the location degeneracy plays no
# part and the only variable is the tail.
#
# Three arms:
#   n3v2_hard_epibe  - this file
#   n3v2_hard_pibe   - ebm.enabled: false
#   n3v2_hard_gauss  - ebm.enabled: false, noise_family: gaussian
# The third tests the premise: if PIBE under contamination matches PIBE under
# Gaussian noise of the same sd, the tails cost it nothing and there is nothing
# for the EBM to recover, whatever the EBM then does.

system:
  name: automatica_n3v2
  kwargs:
    theta_seed: 0
data:
  n_trajectories: 64
  n_samples: 201
  horizon: 20.0
  substeps: 8
  noise_sigma: 0.05
  noise_truncation_sigmas: 3.0
  noise_family: contaminated
  noise_bias: 0.0
  noise_bias_relative: false
  train_fraction: 0.8
  sample_disturbance_per_trajectory: false
  sample_theta_per_trajectory: false
  seed: 1
  noise_kwargs:
    contamination: 0.05
    outlier_scale: 8.0
basis:
  kind: fourier
  q: 3
  omega: 1.2566370614359172
  coeff_lo:
  - -0.18
  - -0.18
  - -0.12
  coeff_hi:
  - 0.18
  - 0.18
  - 0.12
  remainder_amplitude: 0.0
architecture:
  latent_dim: 32
  encoder_hidden:
  - 128
  - 128
  decoder_hidden:
  - 64
  - 64
  - 64
  head_hidden:
  - 64
  - 64
  activation: tanh
  time_fourier_features: 10
  time_feature_scaling: true
training:
  n_total: 6000
  n_par: 3000
  lam: 1.0
  n_collocation: 401
  batch_size: 16
  lr_local: 0.001
  lr_global: 0.0005
  grad_clip: 1.0
  log_every: 500
  seed: 0
  lr_schedule: cosine
  final_global_iters: 30000
  checkpoint_every: 2000
ebm:
  enabled: true
  beta: 1.0
  hidden:
  - 64
  - 64
  energy_bound: 12.0
  spectral_norm: false
  weight_bound: 10.0
  panels: 64
  nodes_per_panel: 16
  radius: 0.9
  cells:
  - 2
  n_ebm: 1000
  n_fit: 800
  lr_ebm: 0.002
device: auto
dtype: float64
seed: 0
output_dir: outputs/n3v2_hard_epibe

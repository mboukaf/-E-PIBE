# PIBE on the fourth-order triangular benchmark.
#
#   xdot_1 = x_2 - 0.35 tanh(x_1) + th_1 (0.8 + 0.2 cos x_1)
#   xdot_2 = x_3 - 0.30 tanh(x_2) + 0.10 sin x_1
#                + th_2 (1.2 + 0.6 cos 6 x_2)
#   xdot_3 = x_4 - 0.25 tanh(x_3) + 0.10 sin(x_1 + x_2)
#                + th_3 (1.15 + 0.55 cos 10 x_3)
#   xdot_4 = -0.576 x_1 - 2.736 x_2 - 4.76 x_3 - 3.6 x_4
#                + 0.15 sin x_1 + 0.08 tanh(x_2 x_3)
#                + 0.08 th_1 sin x_2 + 0.06 th_2 sin x_3 + 0.05 th_3 tanh x_4 + d(t)
#   y      = x_1 + omega
#
# Linear skeleton: (s+0.6)(s+0.8)(s+1)(s+1.2)  -> stable backbone.
# Sensitivities vary 96%/182%/183% on-trajectory, keyed to x_1/x_2/x_3 with
# multipliers matched to each coordinate's span -> 27.5x more identifiability
# curvature than revision 1 (whose s_2, s_3 varied only 4% and 1%).

system:
  name: automatica_n4v3
  kwargs:
    theta_seed: 0     # theta_i ~ U[-0.25, 0.25], drawn once then held constant

data:
  n_trajectories: 64        # P
  n_samples: 201            # N over [0, T]; h_d = 0.05
  horizon: 20.0             # T -- exactly four periods of the fundamental
  substeps: 8
  noise_sigma: 0.002       # see below: 0.01 puts the 2nd harmonic of d under the noise
  noise_truncation_sigmas: 3.0
  train_fraction: 0.8
  seed: 1

basis:                      # Gamma_4 = [sin(Om t), cos(Om t), sin(2 Om t), cos(2 Om t)]^T
  kind: fourier
  q: 4
  omega: 1.2566370614359172        # Omega = 2*pi/5
  coeff_lo: [-0.15, -0.15, -0.12, -0.12]   # a_1,a_2 ~ U[-0.15,0.15]; a_3,a_4 ~ U[-0.12,0.12]
  coeff_hi: [ 0.15,  0.15,  0.12,  0.12]
  remainder_amplitude: 0.0   # eps_{d,4}: 0.0 = exact basis case; 0.03 = out-of-class
  remainder_rate: 0.15       # r_4(t) = eps * sin(0.15 t^2)

architecture:
  latent_dim: 32
  encoder_hidden: [128, 128]
  decoder_hidden: [64, 64, 64]
  head_hidden: [64, 64]
  activation: tanh
  time_fourier_features: 10   # lifts t into harmonics; a plain MLP cannot
                              # resolve several periods, and that fit error is
                              # what destroys the disturbance estimate downstream

training:
  n_total: 6000
  n_par: 3000
  final_global_iters: 30000   # the final cell is the only place the bank closes
  lam: 1.0
  n_collocation: 401
  batch_size: 16
  lr_local: 1.0e-3
  lr_global: 5.0e-4
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 250
  seed: 0

device: auto
dtype: float64
seed: 0
output_dir: outputs/n4v3

# Cheap reproduction of the cluster collapse (outputs/big_w10_s0).
#
# Same architecture, basis and schedule shape as the big low-omega run;
# only the trajectory count and the iteration budget shrink.  The failure
# to reproduce is a dead gradient in cell 4's local phase followed by a
# ~100x jump in its physics residual, so this needs minutes, not a day.

system:
  name: automatica_n3v2
  kwargs:
    theta_seed: 0
data:
  n_trajectories: 128
  n_samples: 201
  horizon: 20.0
  substeps: 8
  noise_sigma: 0.002
  noise_truncation_sigmas: 3.0
  train_fraction: 0.8
  sample_disturbance_per_trajectory: true
  sample_theta_per_trajectory: false
  seed: 1
basis:
  kind: fourier
  q: 3
  omega: 0.6283185307179586
  coeff_lo:
  - -0.18
  - -0.18
  - -0.12
  coeff_hi:
  - 0.18
  - 0.18
  - 0.12
  remainder_amplitude: 0.0
  remainder_rate: 0.15
architecture:
  latent_dim: 128
  encoder_hidden:
  - 512
  - 512
  decoder_hidden:
  - 256
  - 256
  - 256
  head_hidden:
  - 128
  - 128
  activation: tanh
  time_fourier_features: 10
  time_feature_scaling: true
training:
  n_total: 2500
  n_par: 1000
  final_global_iters: 5000
  lam: 1.0
  n_collocation: 401
  batch_size: 16
  lr_local: 0.001
  lr_global: 0.0005
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 250
  checkpoint_every: 500
  seed: 0
device: auto
dtype: float64
seed: 0
output_dir: outputs/repro_collapse

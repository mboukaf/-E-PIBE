# Corrected big run.  Supersedes automatica_n3v2_big{,_lowomega}.yaml, whose
# first attempt (outputs/big_w10_s0) collapsed after ~8 h: every parameter head
# and cell 3's state decoder saturated against its admissible box, gradient
# norms fell to 1e-7, and the remaining 16 h made no progress at all.
#
# Three changes, in order of importance:
#
#   architecture.saturation_limit: 4.0
#       The fix.  c + r*tanh(z) has a gradient multiplier of 4*exp(-2|z|); the
#       collapsed run reached |z| = 18.4, where that is 4e-16 -- below float64
#       resolution, so the unit is dead permanently.  A straight-through clamp
#       floors it at sech^2(4) = 1.3e-3 while still reaching 99.93% of the box.
#       Reproduced and verified in minutes (configs/automatica_n3v2_repro.yaml):
#       cell 3's objective at i=1000 goes from 1.09e+00 to 1.67e-03.
#
#   training.final_global_iters: 200000 -> 30000
#       200k was never affordable: the observed rate is 0.77 s/iteration, so the
#       final cell alone needed 47 h against a 24 h wall.  30k is the value the
#       working local runs use, and it brings the whole job to about 12 h.
#
#   training.lr_global: 5e-4 -> 2e-4
#       The global phase should refine what the local phases established, not
#       rewrite it.  In the collapsed run cell 2's local loss went from 3.3e-02
#       at the end of its own training to 6.4e-01 during cell 4's global phase.
#

system:
  name: automatica_n3v2
  kwargs:
    theta_seed: 0
data:
  n_trajectories: 2048
  n_samples: 201
  horizon: 20.0
  substeps: 8
  noise_sigma: 0.002
  noise_truncation_sigmas: 3.0
  train_fraction: 0.8
  sample_disturbance_per_trajectory: true
  sample_theta_per_trajectory: false
  seed: 1
basis:
  kind: fourier
  q: 3
  omega: 1.2566370614359172
  coeff_lo:
  - -0.18
  - -0.18
  - -0.12
  coeff_hi:
  - 0.18
  - 0.18
  - 0.12
  remainder_amplitude: 0.0
  remainder_rate: 0.15
architecture:
  latent_dim: 128
  encoder_hidden:
  - 512
  - 512
  decoder_hidden:
  - 256
  - 256
  - 256
  head_hidden:
  - 128
  - 128
  activation: tanh
  time_fourier_features: 10
  time_feature_scaling: true
  saturation_limit: 4.0
training:
  n_total: 20000
  n_par: 8000
  final_global_iters: 30000
  lam: 1.0
  n_collocation: 401
  batch_size: 32
  lr_local: 0.001
  lr_global: 0.0002
  lr_schedule: cosine
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 2000
  checkpoint_every: 2000
  seed: 0
device: auto
dtype: float64
seed: 0
output_dir: outputs/big_v2
